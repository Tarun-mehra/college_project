<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programme Directory | R.K. Arya College</title>
    <meta name="description" content="Explore programme information, eligibility, career prospects, outcomes and semester subjects at R.K. Arya College." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #241b19; --muted: #6d625b; --paper: #fbf7f1; --panel: #fffdf9; --line: #e8ddd0; --red: #821018; --red-dark: #5b0c12; --gold: #c79a43; --green: #315d4f; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.65 "DM Sans", sans-serif; }
      h1, h2, h3 { margin: 0; font-family: "Playfair Display", serif; line-height: 1.15; }
      a { color: inherit; }
      .programme-hero { padding: 5rem 1.25rem 4.5rem; color: #fffaf2; background: linear-gradient(120deg, var(--red-dark), var(--red) 58%, #a23428); }
      .programme-wrap { width: min(1120px, calc(100% - 2.5rem)); margin: 0 auto; }
      .breadcrumb { display: flex; gap: .55rem; margin-bottom: 2rem; color: #f1d8a7; font-size: .88rem; }
      .breadcrumb a { text-decoration: none; }
      .eyebrow { display: block; margin-bottom: .8rem; color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .programme-hero h1 { max-width: 820px; font-size: clamp(2.4rem, 6vw, 5rem); }
      .programme-hero p { max-width: 760px; margin: 1.35rem 0 0; color: #f6e8d4; font-size: 1.08rem; }
      .programme-main { padding: 3.5rem 0 5rem; }
      .directory { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
      .directory-card, .info-card, .outcome-card, .career-card, .subjects-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      .directory-card { display: flex; min-height: 150px; padding: 1.25rem; flex-direction: column; justify-content: space-between; text-decoration: none; transition: transform .2s, border-color .2s; }
      .directory-card:hover, .directory-card:focus-visible { border-color: var(--gold); transform: translateY(-3px); }
      .directory-card strong { color: var(--red); font-size: 1.35rem; }
      .directory-card span { color: var(--muted); font-size: .9rem; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 3.5rem 0 1.25rem; }
      .section-heading h2 { font-size: clamp(1.7rem, 3vw, 2.35rem); }
      .back-link { color: var(--red); font-weight: 700; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }
      .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      .info-card { padding: 1.2rem; }
      .info-card dt { color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .info-card dd { margin: .35rem 0 0; font-weight: 600; }
      .intro { max-width: 820px; margin: 1rem 0 0; color: var(--muted); }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .8rem; }
      .career-card, .outcome-card { padding: 1rem; }
      .career-card { border-top: 3px solid var(--gold); }
      .outcome-card { border-left: 3px solid var(--green); }
      .course-label { margin-top: 1.1rem; color: var(--red); font-weight: 700; }
      .semester-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
      .semester-tabs button { min-width: 7rem; padding: .7rem 1rem; color: var(--red-dark); background: #f3e7d5; border: 1px solid transparent; border-radius: 4px; font: inherit; font-weight: 700; cursor: pointer; }
      .semester-tabs button[aria-selected="true"], .semester-tabs button:hover, .semester-tabs button:focus-visible { color: #fff; background: var(--red); border-color: var(--red); }
      .subjects-panel { overflow: hidden; }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; min-width: 650px; border-collapse: collapse; }
      caption { padding: 1rem 1.2rem; color: var(--muted); text-align: left; font-weight: 700; }
      th, td { padding: .85rem 1.2rem; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { color: var(--muted); background: #f7efe3; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
      td:first-child { width: 16%; color: var(--red); font-weight: 700; }
      td:last-child, th:last-child { width: 12%; text-align: right; }
      .note { margin: 0; padding: .8rem 1.2rem; color: var(--muted); background: #f7efe3; font-size: .9rem; }
      .list-block { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.25rem; }
      .list-block section { padding: 1.25rem; background: #f3e7d5; border-radius: 6px; }
      .list-block h3 { margin-bottom: .65rem; font-size: 1.25rem; }
      ul { margin: 0; padding-left: 1.2rem; }
      li + li { margin-top: .35rem; }
      .empty-state { padding: 3rem 1rem; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); }
      @media (max-width: 700px) { .programme-hero { padding: 3.5rem 1.25rem; } .summary { grid-template-columns: 1fr; } .section-heading { align-items: start; flex-direction: column; } .programme-main { padding-top: 2.2rem; } }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <header class="programme-hero">
      <div class="programme-wrap">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span aria-hidden="true">/</span><span id="breadcrumb-current">Programme Directory</span></nav>
        <span class="eyebrow">Academic Programmes</span>
        <h1 id="page-title">Programme Directory</h1>
        <p id="page-description">Explore undergraduate and postgraduate programmes, with course information, outcomes and semester structures.</p>
      </div>
    </header>
    <main id="programme-content" class="programme-main"><div class="programme-wrap"></div></main>
    <script src="../js/programmes-data.js"></script>
    <script src="../js/programme-page.js"></script>
    <script src="../script.js" defer></script>
  </body>
</html>
